version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./smart_todo.db:/app/smart_todo.db
    environment:
      - FLASK_ENV=development
      - FLASK_APP=src/backend/app.py
    depends_on:
      - db

  # Если вы хотите использовать PostgreSQL или MySQL — раскомментируйте и настройте
